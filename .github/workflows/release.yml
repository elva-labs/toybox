name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          tar -czf "out/toybox-${version}.tar.gz" -C dist toybox.js
          shasum -a 256 "out/toybox-${version}.tar.gz" > "out/toybox-${version}.tar.gz.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
